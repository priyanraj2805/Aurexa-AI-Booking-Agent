# DotStark single-URL gateway
# dotstark.tech serves tenant dashboard at root:
#   /          -> admin-panel:3002  (TENANT, /dashboard)
#   /api/*     -> backend:8005
#   /health    -> backend:8005
# TLS terminates at cloudflared; internal traffic is plain HTTP.

# Log timings. The stock `combined` format has no request time, which is what
# made slow dashboard responses undiagnosable -- you could see a request
# arrived but not that it took 15 seconds. `rt` is nginx-side total, `urt` is
# the upstream's own time; a large gap between them points at nginx/tunnel
# rather than the application.
log_format upstream_timing '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                           'rt=$request_time urt=$upstream_response_time '
                           '"$http_referer" "$http_user_agent"';

# Only send "Connection: upgrade" for genuine WebSocket handshakes.
#
# It used to be set unconditionally on /api/ and /, which tells nginx the
# connection is an upgrade on every ordinary request. That switches the
# connection out of keepalive mode, so each API call pays a fresh TCP
# handshake, and it made proxied traffic harder to diagnose.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream admin_panel {
    server admin-panel:3002;
}

upstream backend_api {
    server backend:8005;
}

server {
    listen 80;
    server_name dotstark.tech www.dotstark.tech localhost;

    # Without these, `docker logs booking_agent-gateway-1` showed nothing and
    # 502s had to be diagnosed by inference. Log to stdout so the container
    # logs carry them.
    access_log /dev/stdout upstream_timing;
    error_log  /dev/stderr warn;

    # Document and logo uploads go through /api/. nginx defaults to 1 MB,
    # which rejects the platform's own 25 MB PDF limit.
    client_max_body_size 30m;

    # Docker embedded DNS - re-resolve upstreams per request so recreating
    # app containers never leaves stale IPs (no more 502s after deploys).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # A WhatsApp turn can spend up to ~45s in the engine (LLM call plus
    # retries) and the backend runs single-process, so an API request can
    # legitimately wait that long. nginx's 60s default was close enough to
    # the edge that a slow turn surfaced as 502/504. Keepalive also needs a
    # read timeout comfortably above the slowest normal request.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # API and health -> backend
    location /api/ {
        set $api_upstream backend:8005;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /health {
        set $api_upstream backend:8005;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Everything else: tenant plane (root app -> admin-panel:3002).
    location / {
        set $panel_upstream admin-panel:3002;
        proxy_pass http://$panel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}