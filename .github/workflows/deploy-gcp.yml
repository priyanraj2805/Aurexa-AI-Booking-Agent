
name: GCP Deployment - BookingChatBot

on:
  workflow_dispatch:
  push:
    branches:
      - Aurexa-production

permissions:
  contents: read

concurrency:
  group: bookingchatbot-production
  cancel-in-progress: false

jobs:
  verify-and-stage:
    name: Verify SSH and stage release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: Aurexa-production
          persist-credentials: false

      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GCP_VM_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$VM_HOST"
          test -n "$VM_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null
          ssh-keygen -F "$VM_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null

          cat > "$HOME/.ssh/config" <<EOF
          Host gcp-production
            HostName $VM_HOST
            User $VM_USER
            IdentityFile $HOME/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            BatchMode yes
          EOF

          chmod 600 "$HOME/.ssh/config"

          ssh gcp-production \
            'sudo -n docker ps --format "{{.Names}}"'

      - name: Package application source
        shell: bash
        run: |
          set -euo pipefail

          test -f backend/Dockerfile
          test -f backend-super/Dockerfile
          test -f frontend/admin-panel/Dockerfile
          test -f frontend/super-admin/Dockerfile
          test -f wa-gateway/Dockerfile
          test -f gateway/nginx.conf

          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            --exclude='*/.env*' \
            --exclude='*/node_modules' \
            --exclude='node_modules' \
            --exclude='*/.git' \
            --exclude='.git' \
            --exclude='*/.venv' \
            --exclude='.venv' \
            --exclude='*/__pycache__' \
            --exclude='__pycache__' \
            --exclude='*/.next' \
            --exclude='.next' \
            backend \
            backend-super \
            frontend/admin-panel \
            frontend/super-admin \
            wa-gateway \
            gateway

          tar -tzf "$RUNNER_TEMP/release.tar.gz"

      - name: Upload source to isolated staging directory
        env:
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$GITHUB_SHA"
          REMOTE_DIR="/home/${VM_USER}/bookingchatbot-staging-${RELEASE_ID}"

          ssh gcp-production \
            "mkdir -p '$REMOTE_DIR'"

          scp "$RUNNER_TEMP/release.tar.gz" \
            "gcp-production:$REMOTE_DIR/source.tar.gz"

          ssh gcp-production bash -s -- "$RELEASE_ID" <<'REMOTE'
          set -euo pipefail

          RELEASE_ID="$1"
          REMOTE_DIR="/home/priyanshuraj/bookingchatbot-staging-${RELEASE_ID}"

          mkdir -p "$REMOTE_DIR/source"
          tar -xzf "$REMOTE_DIR/source.tar.gz" -C "$REMOTE_DIR/source"

          test -f "$REMOTE_DIR/source/backend/Dockerfile"
          test -f "$REMOTE_DIR/source/backend-super/Dockerfile"
          test -f "$REMOTE_DIR/source/frontend/admin-panel/Dockerfile"
          test -f "$REMOTE_DIR/source/frontend/super-admin/Dockerfile"
          test -f "$REMOTE_DIR/source/wa-gateway/Dockerfile"
          test -f "$REMOTE_DIR/source/gateway/nginx.conf"

          if find "$REMOTE_DIR/source" -type f \
            \( -name '.env' -o -name '.env.*' -o -name 'credentials.json' \) \
            -print -quit | grep -q .; then
            echo "Unexpected environment or credential file in staged source."
            exit 1
          fi

          echo "Source staged successfully. Production files were not changed."
          REMOTE

      - name: Validate existing production Compose configuration
        shell: bash
        run: |
          set -euo pipefail

          ssh gcp-production \
            'sudo docker compose \
              -f /home/priyanshuraj/BookingChatBot/docker-compose.yml \
              -f /home/priyanshuraj/BookingChatBot/docker-compose.override.yml \
              config -q'

          echo "Existing production Compose configuration is valid."

      - name: Report successful staging
        run: |
          echo "Staging and verification completed for commit $GITHUB_SHA"
          echo "No production containers were rebuilt or restarted."
